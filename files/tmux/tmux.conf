# ── Additional Server Settings ──
set -sg display-time 4096
set -sg focus-events on
set -sg renumber-windows on
set -sg allow-rename off

# Terminal overrides for true color
set -sa terminal-overrides ",xterm*:Tc"

# Window settings
set -wg automatic-rename off
set -wg pane-base-index 1

# ── Key Bindings ──
unbind C-?
bind ? list-keys
unbind C-c
bind c new-window
unbind C-r
unbind [
bind Escape copy-mode
unbind %
unbind |
bind | split-window -h
unbind '"'
unbind -
bind - split-window -v -d
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 3
bind K resize-pane -U 3
bind L resize-pane -R 5
unbind E
bind E set-window-option synchronize-panes on
unbind e
bind e set-window-option synchronize-panes off
unbind p
bind p paste-buffer
bind a send-prefix
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded!"

# ── Theme — Nixotic Solarized Light ──
# Source of truth: docs/colour-token-taxonomy.md (Appendix F).
# Every colour option is set explicitly, with its token slug alongside, so
# neither tmux's built-in theme colours nor Stylix's base16 target (disabled
# in home/stylix.nix) can leak through.

# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#eee8d5,fg=#657b83"                         # status.bg

# Left status: status.session
set -g status-left-length 40
set -g status-left "#[bg=#268bd2,fg=#fdf6e3,bold] #S #[bg=#eee8d5,fg=#268bd2]"

# Right status: status.date, status.time, status.host
set -g status-right-length 80
set -g status-right "#[fg=#93a1a1]%Y-%m-%d #[fg=#657b83]%H:%M #[bg=#859900,fg=#fdf6e3] #h "

# Window list: colours live in the *-style options, not the formats, so the
# activity and bell styles can take effect
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-separator ""
set -g window-status-style "fg=#93a1a1"                             # status.window
set -g window-status-current-style "bg=#fdf6e3,fg=#002b36,bold"     # status.window_current
set -g window-status-last-style default
set -g window-status-activity-style "fg=#b58900,bold"               # status.window_activity
set -g window-status-bell-style "fg=#dc322f,bold"                   # status.window_bell

# Messages
set -g message-style "bg=#b58900,fg=#fdf6e3"                        # status.message
set -g message-command-style "bg=#fdf6e3,fg=#b58900"                # status.message_command

# Panes
set -g pane-border-style "fg=#eee8d5"                               # ui.border
set -g pane-active-border-style "fg=#268bd2"                        # ui.border_active
set -g pane-scrollbars-style "bg=#eee8d5,fg=#93a1a1,width=1,pad=0"  # ui.scrollbar
set -g display-panes-colour "#93a1a1"                               # ui.pane_label
set -g display-panes-active-colour "#268bd2"                        # ui.pane_label_active
set -g display-panes-border-style "fg=#268bd2"                      # ui.popup.border

# Copy mode
set -g mode-style "bg=#657b83,fg=#fdf6e3"                           # ui.selection
set -g copy-mode-current-match-style "bg=#b58900,fg=#fdf6e3,bold"   # ui.search_current
set -g copy-mode-match-style "bg=#93a1a1,fg=#fdf6e3"                # ui.search_other
set -g copy-mode-mark-style "bg=#6c71c4,fg=#fdf6e3"                 # ui.mark
set -g copy-mode-line-number-style "fg=#839496"                     # ui.line_number
set -g copy-mode-current-line-number-style "fg=#657b83,bold"        # ui.line_number_current
set -g copy-mode-current-line-style "bg=#eee8d5"                    # ui.cursorline
set -g switch-mode-match-style "bg=#93a1a1,fg=#fdf6e3"              # ui.search_other
set -g clock-mode-colour "#268bd2"                                  # ui.clock

# Tree mode (choose-tree, choose-session)
set -g tree-mode-selection-style "bg=#eee8d5"                       # ui.cursorline
set -g tree-mode-border-style "fg=#93a1a1"                          # status.separator
# Active pane/window label: ui.pane_label_active; others: ui.pane_label
set -g tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#268bd2,#93a1a1}"

# Menus and popups
set -g menu-style "bg=#eee8d5,fg=#657b83"                           # ui.popup.bg
set -g menu-selected-style "bg=#657b83,fg=#fdf6e3"                  # ui.selection
set -g menu-border-style "bg=#eee8d5,fg=#268bd2"                    # ui.popup.border
set -g popup-style "bg=#eee8d5,fg=#657b83"                          # ui.popup.bg
set -g popup-border-style "bg=#eee8d5,fg=#268bd2"                   # ui.popup.border
