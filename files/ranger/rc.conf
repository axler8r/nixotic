# ── Visual Settings ──
# Color scheme
set colorscheme solarized

# Syntax highlighting style for file previews
set preview_script ~/.config/ranger/scope.sh
set use_preview_script true

# Draw borders between panes and outline
set draw_borders both

# Show image previews using kitty's image protocol
set preview_images true
set preview_images_method kitty

# ── UI Improvements ──
# Relative line numbers like vim
set line_numbers relative
set dirname_in_tabs true

# Left, middle, right pane sizes
set column_ratios 1,3,4

# ── Display Options ──
# Show hidden files
set show_hidden true

# Confirm before deleting
set confirm_on_delete always

# ── Icons ──
# Uncomment after installing devicons plugin:
# default_linemode devicons
